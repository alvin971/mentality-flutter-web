name = "mentality-r2-upload"
main = "index.js"
compatibility_date = "2025-01-01"

# ─────────────────────────────────────────────────────────────────────────────
# Binding R2 — le bucket est résolu côté serveur, aucune clé n'atteint le client.
#
# `jurisdiction = "eu"` est OBLIGATOIRE : sans cette ligne, le Worker ne se lie
# PAS à un bucket EU (il chercherait un bucket standard du même nom). C'est ce
# qui garantit techniquement la résidence des données en Europe (RGPD).
# ─────────────────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "mentality-audio"
jurisdiction = "eu"

# ─────────────────────────────────────────────────────────────────────────────
# Mise en place (RGPD : résidence des données dans l'UE)
#
#   1. Créer le bucket en JURIDICTION EU (obligatoire pour la conformité) :
#        wrangler r2 bucket create mentality-audio --jurisdiction eu
#      Puis dans le dashboard, vérifier que la juridiction affichée est « EU ».
#
#   2. Déployer le worker :
#        cd workers/r2-upload
#        wrangler deploy
#
#   3. Copier l'URL du worker dans :
#        lib/core/constants/app_constants.dart → r2UploadWorkerUrl
#
#   4. Ajouter le domaine Pages de l'app dans ALLOWED_ORIGINS (index.js).
# ─────────────────────────────────────────────────────────────────────────────

# Cron de nettoyage (handler scheduled() dans index.js) : supprime les données
# des comptes PROVISOIRES abandonnés (sans marqueur validated/<account>) au-delà
# de RETENTION_DAYS. Tous les jours à 03:00 UTC.
[triggers]
crons = ["0 3 * * *"]

# ─────────────────────────────────────────────────────────────────────────────
# Workers AI — transcription des enregistrements (vérification, cf. index.js).
# Aucune ressource à créer : le binding est disponible dès que Workers AI est
# actif sur le compte. Modèle appelé : @cf/openai/whisper (facturé à la minute
# d'audio). Sans ce binding, le worker stocke quand même et écrit un verdict
# ok:false `ai_unavailable` — l'upload ne dépend jamais de l'IA.
# ─────────────────────────────────────────────────────────────────────────────
[ai]
binding = "AI"

[vars]
RETENTION_DAYS = "30"
CLEANUP_MAX_OBJECTS = "20000"

# ─── Vérification des enregistrements ────────────────────────────────────────
# Lecture : part minimale des mots du texte de référence (corpus/<textId>.json,
# publié par scripts/publish-corpus.mjs) retrouvés dans la transcription pour
# que le verdict soit ok. 0.30 = valeur de départ (transcription bon marché,
# pas exacte) ; à ajuster après observation des verdicts réels.
VERIFY_MIN_OVERLAP = "0.30"
# Résumé (pas de référence) : nombre minimal de mots distincts (≥ 4 caractères,
# après normalisation) dans la transcription pour que le verdict soit ok.
VERIFY_MIN_SUMMARY_WORDS = "15"

# ─────────────────────────────────────────────────────────────────────────────
# LEGAL_VERSIONS — versions de textes légaux dont ce worker accepte d'ARCHIVER
# le consentement. CSV, même convention et mêmes valeurs que la var du même nom
# dans workers/tokeniser/wrangler.toml (qui, elle, filtre à l'ÉMISSION).
#
# POURQUOI ELLE EXISTE ICI AUSSI. La `cv` d'un passe sv 3 est recopiée telle
# quelle dans `customMetadata.consent_version` : elle est LA preuve conservée
# avec le fichier. Un worker qui écrit une preuve sans savoir à quel texte elle
# renvoie archive un consentement invérifiable. Le contrôle à l'émission ne
# suffit pas : les passes déjà signés circulent, et rien ne permettrait d'en
# révoquer une version sans cette liste côté écriture.
#
# LEVIER DE RÉVOCATION : retirer une version d'ici bloque immédiatement les
# nouveaux uploads qui s'en réclament (403 LEGAL_VERSION_UNKNOWN), sans
# ré-émettre un seul passe. Les objets DÉJÀ écrits ne sont pas touchés.
#
# ⚠️ Vider ou supprimer cette var ferme le worker en sv 3 (500
# SERVER_MISCONFIGURED) : fail-closed assumé, on préfère ne rien écrire à
# écrire un consentement dont on ne peut pas produire le texte.
#
# À la publication d'une nouvelle version de textes : AJOUTER la nouvelle
# valeur (« ancienne,nouvelle ») le temps que les passes en circulation se
# renouvellent, puis retirer l'ancienne.
# ─────────────────────────────────────────────────────────────────────────────
LEGAL_VERSIONS = "2026-09-02.v1"
