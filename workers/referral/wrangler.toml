name = "mentality-referral"
main = "index.js"
compatibility_date = "2025-01-01"

# ─────────────────────────────────────────────────────────────────────────────
# Worker du système de déblocage des résultats par paliers (referral).
# Stockage : Cloudflare KV (aucun secret externe requis).
# ─────────────────────────────────────────────────────────────────────────────

# Namespace KV créé via : wrangler kv namespace create REFERRAL_KV
[[kv_namespaces]]
binding = "REFERRAL_KV"
id = "6c70f3aab78c4aeb92d1255f62edbafd"

[vars]
# Délai (minutes) entre la soumission du pseudo Instagram et le déblocage
# (« vérification en cours »). Réduire pour tester le parcours de bout en bout.
INSTA_UNLOCK_DELAY_MINUTES = "120"
