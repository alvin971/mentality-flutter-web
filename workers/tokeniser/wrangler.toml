name = "mentality-tokeniser"
main = "index.js"
compatibility_date = "2025-01-01"

# ─────────────────────────────────────────────────────────────────────────────
# Worker de signature Ed25519 du token anonyme.
# La clé privée est un SECRET (jamais ici). WebCrypto 'Ed25519' est natif à
# compatibility_date >= 2024 (aucun flag). Ne PAS activer nodejs_compat.
# ─────────────────────────────────────────────────────────────────────────────
#
# Secret requis (à configurer via CLI, JAMAIS commité) :
#   wrangler secret put ED25519_PRIVATE_KEY_B64
#     → coller le base64 du DER PKCS#8 (48 octets) de la clé privée.
#
# Voir README.md pour la génération du keypair et le déploiement.

# Binding R2 (MÊME bucket EU que r2-upload) : utilisé par POST /validate pour
# vérifier qu'un test a réellement produit des enregistrements sous le compte
# (preuve de complétion) avant de valider le token, et pour écrire le marqueur
# validated/<account>. jurisdiction = "eu" OBLIGATOIRE (résidence RGPD).
#
# ⚠️ TEMPORAIREMENT DÉSACTIVÉ (2026-07-03) : R2 n'est pas encore activé sur le
# compte Cloudflare (1 clic dashboard requis). L'émission (POST /) fonctionne
# sans ; seul POST /validate répond 503 (le code garde env.AUDIO_BUCKET).
# → RÉACTIVER ces 4 lignes + `wrangler r2 bucket create mentality-audio
#   --jurisdiction eu` + redéployer, dès que R2 est activé.
# [[r2_buckets]]
# binding = "AUDIO_BUCKET"
# bucket_name = "mentality-audio"
# jurisdiction = "eu"

# Plafond d'émission de tokens (LOT 0 anti-faux-test) : compteur AGRÉGÉ par
# tranche de temps dans KV — clé issue:<n°>, un entier, TTL court. Ni IP, ni
# claims, ni token : rien de rattachable à quiconque (cf. README, « Garanties
# & limites »). Sans ce binding, le code est FAIL-OPEN (plafond inactif) : un
# frein anti-abus ne doit jamais murer l'inscription.
#
# → ACTIVER en 2 étapes avant `wrangler deploy` :
#   1. npx wrangler kv namespace create RATE_KV
#   2. décommenter ces 3 lignes et coller l'id rendu par la commande.
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<id rendu par `npx wrangler kv namespace create RATE_KV`>"

[vars]
# Nombre minimal d'enregistrements exigé sous le compte pour valider le token
# (proxy de « test complété » ; best-effort uploads → garder bas, ajustable).
MIN_RECORDINGS = "1"
# Plafond d'émission : fenêtre (minutes) et maximum d'émissions par fenêtre.
# Valeurs de départ actées avec le fondateur (2026-08-06) : 300/heure —
# prudent-large, à affiner après observation du compteur en KV.
ISSUE_WINDOW_MINUTES = "60"
ISSUE_MAX_PER_WINDOW = "300"
