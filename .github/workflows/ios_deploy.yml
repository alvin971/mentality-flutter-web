name: iOS Deploy — TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter setup ────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 3. Ruby + Fastlane setup ────────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      # ── 4. CocoaPods ────────────────────────────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      # ── 5. Clé API App Store Connect ────────────────────────────────────────
      - name: Write App Store API key
        run: |
          KEY_FILE="/tmp/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8"
          CONTENT="${{ secrets.APP_STORE_API_KEY_CONTENT }}"

          # Support les deux formats : PEM brut ou PEM encodé en base64
          # Si le contenu commence par "-----BEGIN", c'est du PEM brut
          FIRST_CHARS=$(printf '%s' "$CONTENT" | head -c 5)
          if [ "$FIRST_CHARS" = "-----" ]; then
            printf '%s' "$CONTENT" > "$KEY_FILE"
            echo "Clé API : format PEM brut"
          else
            printf '%s' "$CONTENT" | base64 --decode > "$KEY_FILE"
            echo "Clé API : format base64 décodé"
          fi

          # Diagnostic sans exposer le contenu
          echo "Taille clé : $(wc -c < $KEY_FILE) octets"
          echo "Première ligne : $(head -1 $KEY_FILE | cut -c1-40)"

          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_FILE" ~/.appstoreconnect/private_keys/

      # ── 5b. Patch Fastlane spaceship — fix ARM64 invalid curve name ──────────
      - name: Patch Fastlane spaceship token.rb (ARM64 OpenSSL fix)
        run: |
          # OpenSSL::PKey::EC.new échoue sur ARM64 avec les clés Apple P-256 (PKCS8)
          # OpenSSL::PKey.read fonctionne via l'API EVP qui gère correctement les OIDs
          TOKEN_RB=$(find ios/vendor/bundle -name "token.rb" \
            -path "*/spaceship/connect_api/*" 2>/dev/null | head -1)
          if [ -n "$TOKEN_RB" ]; then
            sed -i '' \
              's/OpenSSL::PKey::EC\.new(private_key)/OpenSSL::PKey.read(private_key)/g' \
              "$TOKEN_RB"
            echo "Patched: $TOKEN_RB"
            grep -n "private_key\s*=" "$TOKEN_RB" | head -3
          else
            echo "WARN: token.rb non trouvé dans vendor/bundle — bundle pas encore installé ?"
          fi

      # ── 6. Build Flutter iOS ─────────────────────────────────────────────────
      - name: Diagnostic — environnement
        run: |
          echo "## Environnement" >> $GITHUB_STEP_SUMMARY
          echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- Flutter: $(flutter --version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- CocoaPods: $(pod --version)" >> $GITHUB_STEP_SUMMARY
          flutter doctor --suppress-analytics 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true

      - name: Build Flutter iOS (release)
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build.log
          EXIT=${PIPESTATUS[0]}
          echo "## Build log (dernières 80 lignes)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT -ne 0 ]; then
            ERR=$(grep -i "error:" /tmp/flutter_build.log | tail -5 | tr '\n' ' ' | cut -c1-300)
            echo "::error::Flutter build failed — $ERR"
          fi
          exit $EXIT

      # ── 7. Fastlane — signature + upload TestFlight ──────────────────────────
      - name: Upload to TestFlight via Fastlane
        env:
          APP_STORE_KEY_ID:           ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID:        ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_CONTENT:  ${{ secrets.APP_STORE_API_KEY_CONTENT }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID:                ${{ secrets.ITC_TEAM_ID }}
        run: |
          cd ios
          bundle exec fastlane beta 2>&1 | tee /tmp/fastlane.log
          EXIT=${PIPESTATUS[0]}
          echo "## Fastlane log (dernières 100 lignes)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/fastlane.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT -ne 0 ]; then
            ERR=$(grep -i "\[!\]\|error\|fail" /tmp/fastlane.log | tail -8 | tr '\n' ' ' | cut -c1-400)
            echo "::error::Fastlane beta failed — $ERR"
          fi
          exit $EXIT

      # ── 8. Nettoyage ─────────────────────────────────────────────────────────
      - name: Clean up API key
        if: always()
        run: rm -f /tmp/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8
