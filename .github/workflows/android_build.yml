name: Android Build (AAB)

# Produit un Android App Bundle signé en artifact — PAS d'upload Play Store
# (le compte Play Console n'existe pas encore ; l'upload se fera manuellement
# ou via un job dédié plus tard).
#
# Secrets GitHub requis pour la signature de production :
#   ANDROID_KEYSTORE_BASE64   : base64 du fichier .jks
#   ANDROID_KEYSTORE_PASSWORD : storePassword
#   ANDROID_KEY_ALIAS         : keyAlias (mentality)
#   ANDROID_KEY_PASSWORD      : keyPassword
# Sans ces secrets, le build tombe en signature debug (AAB non publiable,
# mais la CI reste verte — utile pour vérifier la compilation).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/android_build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Restore production keystore (si secrets présents)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secrets keystore absents — build en signature debug (non publiable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=$(pwd)/android/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Keystore de production restauré."

      - name: Dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentality-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
