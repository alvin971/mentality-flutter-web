name: mentality
description: Application mobile de test de QI adaptatif par IA - Inspirée des échelles Wechsler (WPPSI, WISC, WAIS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== STATE MANAGEMENT =====
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ===== NAVIGATION =====
  go_router: ^14.6.3

  # ===== UI COMPONENTS =====
  flutter_screenutil: ^5.9.3

  # ===== PDF EXPORT =====
  pdf: ^3.11.1
  printing: ^5.13.2

  # ===== NETWORKING =====
  http: ^1.2.0

  # ===== AUDIO RECORDING =====
  record: ^5.1.2

  # ===== IDENTIFIANTS =====
  uuid: ^4.4.2

  # ===== PERSISTANCE =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===== TESTS =====
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # ===== LINTING =====
  flutter_lints: ^5.0.0

  # ===== CODE GENERATION =====
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - icons/
