name: mentality
description: Application mobile de test de QI adaptatif par IA - Inspirée des échelles Wechsler (WPPSI, WISC, WAIS)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== INTERNATIONALISATION =====
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # ===== STATE MANAGEMENT =====
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ===== NAVIGATION =====
  go_router: ^14.6.3

  # ===== UI COMPONENTS =====
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1

  # ===== PDF EXPORT =====
  pdf: ^3.11.1
  printing: ^5.13.2

  # ===== NETWORKING =====
  http: ^1.2.0

  country_code_picker: ^3.0.0

  # ===== AUDIO RECORDING =====
  record: ^5.1.2

  # ===== IDENTIFIANTS =====
  uuid: ^4.4.2

  # ===== PERSISTANCE =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  cryptography: ^2.9.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.2

dependency_overrides:
  # record_linux 0.7.2 incompatible avec record ^5.1.2 — forcer la version compatible
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===== TESTS =====
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # ===== LINTING =====
  flutter_lints: ^5.0.0

  # ===== CODE GENERATION =====
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - icons/
    - images/picture_span/
    - assets/reading_corpus/

  # Polices EMBARQUÉES (2026-07-25). Auparavant récupérées au runtime par
  # google_fonts : sans réseau au premier lancement, l'app retombait sur la
  # police système et perdait toute son identité éditoriale — plus un
  # changement de fonte visible au démarrage et une requête vers
  # fonts.gstatic.com à chaque ouverture.
  #
  # Ce sont des polices VARIABLES : un seul fichier couvre toutes les
  # graisses, pilotées par l'axe `wght` via TextStyle.fontVariations
  # (cf. app_typography.dart). D'où l'absence de déclaration `weight:` ici.
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
